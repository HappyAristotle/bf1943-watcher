# =====================================================================
#  הגדרות התראות - BF1943 Watcher
#  ערוך את הקובץ הזה ישירות ב-GitHub (אייקון העיפרון) ושמור עם "Commit changes".
#  השינוי נכנס לתוקף בבדיקה הבאה (תוך דקה).
# =====================================================================
#
# כל כלל מתחת ל-rules הוא התראה. לכל כלל 3 שדות:
#
#   map:          שם המפה בדיוק כמו באתר:
#                 Wake Island / Guadalcanal / Iwo Jima / Coral Sea
#
#   when:         מתי להתריע:
#                   now   = כשמשחקים עכשיו על המפה
#                   next  = כשהמפה היא הבאה בתור
#                   both  = גם וגם
#
#   min_players:  מינימום שחקנים בשרת כדי לקבל התראה
#                 (3 = שלושה ומעלה, כלומר "יותר מ-2")
#
# כדי לכבות כלל זמנית, שים # בתחילת כל אחת מהשורות שלו.

rules:
  - map: Coral Sea
    when: both
    min_players: 2


settings:
  # אחרי התראה, אותה התראה (אותו שרת + אותה מפה + אותו סוג) לא תישלח שוב
  # עד שהתנאי יתבטל לפחות כך וכך דקות ויחזור.
  # זה מונע הצפה כשמספר השחקנים קופץ סביב הסף (3 -> 2 -> 3).
  rearm_minutes: 10
